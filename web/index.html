<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klipper Öğren">
<meta name="theme-color" content="#11151d">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Klipper Öğren</title>
<style>
:root{
  --bg:#11151d; --bg2:#171c26; --card:#1b2130; --card2:#222a3b; --line:#2b3346; --text:#f3f5fa; --muted:#8e98ad;
  --green:#3ddc84; --green-d:#22a861; --red:#ff5a5f; --red-d:#c9383d; --blue:#4ea1ff; --blue-d:#2f74d0;
  --amber:#ffc53d; --orange:#ff8a3d; --pink:#ff6fb1; --purple:#a78bfa;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease-out: cubic-bezier(.22,1,.36,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overscroll-behavior:none}
body{-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;padding:0}
a{color:var(--blue);text-decoration:none;font-weight:700}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.press{transition:transform .12s var(--ease-out)}
.press:active{transform:scale(.96)}

/* ---------- Üst bar ---------- */
.topbar{padding:calc(var(--st) + 8px) 14px 8px;display:flex;align-items:center;gap:8px;background:var(--bg);flex-shrink:0;position:relative;z-index:3}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;letter-spacing:-.3px;flex:1;min-width:0}
.topbar .brand svg{width:34px;height:34px;flex-shrink:0}
.chipstat{display:flex;align-items:center;gap:4px;font-weight:900;font-size:15px;padding:6px 9px;border-radius:12px;background:var(--card)}
.chipstat .i{font-size:16px}
.chipstat.fire{color:var(--orange)}.chipstat.fire.cold{color:var(--muted)}.chipstat.fire.cold .i{filter:grayscale(1);opacity:.6}
.chipstat.xp{color:var(--amber)}.chipstat.spool{color:var(--pink)}
.chipstat.bump{animation:bump .5s var(--ease-spring)}
@keyframes bump{40%{transform:scale(1.25)}}

/* ---------- Ekran ---------- */
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px calc(96px + var(--sb))}
.screen.enter{animation:screenIn .28s var(--ease-out)}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}}

/* ---------- Sekme çubuğu ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg);border-top:2px solid var(--line);padding:6px 6px calc(6px + var(--sb));z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;color:var(--muted);font-size:11px;font-weight:800;position:relative;border-radius:14px;border:2px solid transparent;transition:background .2s}
.tab .ic{font-size:24px;line-height:1;filter:grayscale(1) brightness(.85);opacity:.75;transition:transform .2s var(--ease-spring)}
.tab.on{color:var(--text);background:#1d2a3f;border-color:#2c4a73}
.tab.on .ic{filter:none;opacity:1;transform:scale(1.1)}
.tab .badge{position:absolute;top:0;left:calc(50% + 7px);background:var(--red);color:#fff;font-size:10px;font-weight:900;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}

/* ---------- Nozi ---------- */
.nozi{display:block;overflow:visible}
.nozi .body{transform-origin:50px 100px;animation:bob 2.6s ease-in-out infinite}
.nozi .eyes{transform-origin:50px 40px;animation:blink 4.2s infinite}
.nozi.happy .body,.nozi.cheer .body{animation:hop .9s var(--ease-spring) infinite}
.nozi.sad .body{animation:sadsway 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-8px) scale(.97,1.03)}60%{transform:translateY(0) scale(1.04,.96)}}
@keyframes sadsway{50%{transform:rotate(-4deg) translateY(2px)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.nozi .spark{animation:twinkle 1.2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2;transform:scale(.6)}}

/* ---------- Kartlar ---------- */
.card{background:var(--card);border-radius:20px;padding:16px;margin-bottom:12px;border:2px solid var(--line)}
.card h3{margin:0 0 4px;font-size:17px;font-weight:900}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.sec-title{font-size:18px;font-weight:900;margin:22px 2px 10px;letter-spacing:-.2px}

.btn{display:block;width:100%;padding:15px;border-radius:16px;font-weight:900;font-size:16px;text-align:center;letter-spacing:.6px;text-transform:uppercase;transition:transform .1s var(--ease-out),box-shadow .1s var(--ease-out);position:relative}
.btn:active{transform:translateY(4px)}
.btn.primary{background:var(--green);color:#063a1d;box-shadow:0 4px 0 var(--green-d)}
.btn.primary:active{box-shadow:0 0 0 var(--green-d)}
.btn.primary:disabled{background:#2a3244;color:#5d677d;box-shadow:0 4px 0 #1d2433;transform:none}
.btn.blue{background:var(--blue);color:#06203f;box-shadow:0 4px 0 var(--blue-d)}
.btn.blue:active{box-shadow:none}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);color:var(--text)}
.btn.ghost:active{box-shadow:none}
.btn.danger{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.btn.sm{width:auto;padding:10px 16px;font-size:13px;border-radius:13px;display:inline-block}

/* ---------- Ana sayfa ---------- */
.hello{display:flex;align-items:flex-end;gap:10px;margin:6px 0 14px}
.hello .nz{width:76px;flex-shrink:0}
.bubble{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;font-weight:800;font-size:15px;line-height:1.35;flex:1}
.bubble::before{content:"";position:absolute;left:-10px;bottom:18px;border:8px solid transparent;border-right-color:var(--line)}
.bubble::after{content:"";position:absolute;left:-6px;bottom:20px;border:6px solid transparent;border-right-color:var(--card)}
.bubble .sub{display:block;color:var(--muted);font-weight:700;font-size:13px;margin-top:3px}

.quests{padding:14px}
.quest{display:flex;align-items:center;gap:12px;padding:8px 0}
.quest .qi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:21px;background:var(--card2);flex-shrink:0}
.quest .qt{font-weight:800;font-size:14px;margin-bottom:6px}
.bar{height:14px;border-radius:7px;background:#2a3244;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:7px;background:var(--amber);transition:width .6s var(--ease-out);position:relative}
.bar i::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
.bar .lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.claim{background:var(--pink);color:#3d0620;font-weight:900;font-size:12px;padding:8px 10px;border-radius:11px;box-shadow:0 3px 0 #c2407e;animation:wiggle 1.4s ease-in-out infinite;white-space:nowrap}
.claim:active{transform:translateY(3px);box-shadow:none}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-6deg)}90%{transform:rotate(6deg)}95%{transform:rotate(-3deg)}}
.claimed{font-size:20px}

.alert{display:flex;align-items:center;gap:12px;border-radius:18px;padding:12px 14px;margin-bottom:12px;font-weight:800}
.alert.review{background:#2a2213;border:2px solid #5c4613}
.alert.news{background:#14233a;border:2px solid #24426b}
.alert .ai{font-size:28px}
.alert .at{flex:1}
.alert .at small{display:block;font-weight:700;color:var(--muted);font-size:12.5px;margin-top:2px}

/* Ünite başlığı: katman katman basılan parça */
.unit{margin:26px 0 8px}
.unit-head{border-radius:22px;padding:16px 16px 16px 18px;color:#fff;position:relative;overflow:hidden;display:flex;gap:12px;align-items:center;box-shadow:0 5px 0 var(--ud)}
.unit-head .ut{flex:1;min-width:0;position:relative;z-index:1}
.unit-head .un{font-size:13px;font-weight:900;opacity:.85}
.unit-head h2{margin:2px 0 4px;font-size:21px;font-weight:900;letter-spacing:-.3px;line-height:1.15}
.unit-head p{margin:0;font-size:13.5px;font-weight:700;opacity:.92}
.unit-head .uc{font-size:12px;font-weight:900;margin-top:8px;background:rgba(0,0,0,.18);display:inline-block;padding:4px 9px;border-radius:9px}
.printobj{width:84px;height:96px;flex-shrink:0;position:relative;z-index:1}
.unit-head .tex{position:absolute;inset:0;opacity:.12;background-image:repeating-linear-gradient(0deg,#fff 0 2px,transparent 2px 9px)}

.path{display:flex;flex-direction:column;align-items:center;gap:34px;padding:58px 0 6px;position:relative}
.node-wrap{display:flex;flex-direction:column;align-items:center;gap:7px;width:160px;position:relative}
.node{width:76px;height:70px;border-radius:50%;display:grid;place-items:center;font-size:30px;position:relative;transition:transform .1s var(--ease-out),box-shadow .1s}
.node:active{transform:translateY(6px)}
.node.done{background:var(--uc);box-shadow:0 6px 0 var(--ud)}
.node.done:active,.node.cur:active{box-shadow:0 0 0 var(--ud)}
.node.cur{background:var(--uc);box-shadow:0 6px 0 var(--ud)}
.node.cur::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--uc);opacity:.35;animation:ring 1.8s ease-in-out infinite}
@keyframes ring{50%{transform:scale(1.07);opacity:.12}}
.node.locked{background:#2a3244;box-shadow:0 6px 0 #1b2130;color:#5d677d}
.node.locked span{filter:grayscale(1);opacity:.5}
.node .crown{position:absolute;top:-8px;right:-6px;font-size:20px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.node-label{font-size:13px;font-weight:800;text-align:center;line-height:1.2}
.node-label.locked{color:var(--muted)}
.stars{font-size:11px;letter-spacing:-1px;margin-top:-3px}
.tip{background:#fff;color:#11151d;font-weight:900;font-size:13px;padding:7px 12px;border-radius:12px;position:absolute;top:-44px;white-space:nowrap;animation:tipbob 1.6s ease-in-out infinite;z-index:2;box-shadow:0 3px 0 #c8cfdc}
.tip::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff;border-bottom:0}
@keyframes tipbob{50%{transform:translateY(-5px)}}
.peek{position:absolute;width:62px;top:4px}
.chest{width:88px;height:74px;border-radius:20px;display:grid;place-items:center;font-size:40px;position:relative;background:#2a3244;box-shadow:0 6px 0 #1b2130}
.chest.ready{background:#3a2a10;box-shadow:0 6px 0 #241a08;animation:wiggle 1.4s ease-in-out infinite}
.chest.ready::after{content:"";position:absolute;inset:-6px;border-radius:24px;border:3px solid var(--amber);opacity:.5}
.chest.open{opacity:.55}

/* ---------- Ders ekranı ---------- */
.lesson{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;animation:slideUp .32s var(--ease-out)}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}}
.l-top{padding:calc(var(--st) + 10px) 14px 6px;display:flex;align-items:center;gap:10px}
.l-close{font-size:24px;color:var(--muted);width:36px;height:36px;display:grid;place-items:center;font-weight:900}
.l-bar{flex:1;position:relative;height:30px;display:flex;align-items:center}
.l-track{position:absolute;left:0;right:0;height:16px;border-radius:8px;background:#2a3244}
.l-fill{position:absolute;left:0;height:16px;border-radius:8px;background:var(--uc,var(--green));transition:width .5s var(--ease-out);min-width:16px;overflow:hidden}
.l-fill::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.l-fill .layers{position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.12) 0 2px,transparent 2px 7px)}
.l-head{position:absolute;top:-6px;width:26px;height:34px;margin-left:-13px;transition:left .5s var(--ease-out);pointer-events:none}
.combo{font-weight:900;color:var(--orange);font-size:15px;display:flex;align-items:center;gap:2px;min-width:44px;justify-content:flex-end}
.combo.pop{animation:bump .45s var(--ease-spring)}
.l-body{flex:1;overflow-y:auto;padding:8px 18px 20px}
.l-foot{padding:14px 18px calc(14px + var(--sb))}
.q-kind{font-size:13px;font-weight:900;color:var(--muted);margin:10px 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.q-kind .rv{background:#2a2213;color:var(--amber);padding:3px 9px;border-radius:9px;font-size:12px}
.q-text{font-size:21px;font-weight:900;line-height:1.3;margin:0 0 16px;letter-spacing:-.2px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{text-align:left;padding:15px 16px;border-radius:16px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);font-size:16px;line-height:1.35;font-weight:700;transition:transform .1s var(--ease-out),box-shadow .1s,border-color .15s,background .15s}
.fresh .opt,.fresh .chip{animation:optIn .35s var(--ease-out) both}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.fresh .opts .opt:nth-child(2),.fresh .chip:nth-child(2){animation-delay:.05s}.fresh .opts .opt:nth-child(3),.fresh .chip:nth-child(3){animation-delay:.1s}.fresh .opts .opt:nth-child(4),.fresh .chip:nth-child(4){animation-delay:.15s}.fresh .chip:nth-child(5){animation-delay:.2s}
@keyframes optIn{from{opacity:0;transform:translateY(12px)}}
.opt.sel{border-color:var(--blue);background:#15263f;box-shadow:0 4px 0 var(--blue-d);color:#bfe0ff}
.opt.right{border-color:var(--green);background:#123321;box-shadow:0 4px 0 var(--green-d);color:#b7f5cf;animation:pop .35s var(--ease-spring)}
.opt.wrong{border-color:var(--red);background:#3a1618;box-shadow:0 4px 0 var(--red-d);color:#ffc3c5;animation:shake .35s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.opt.code{font-family:var(--mono);font-size:15px;font-weight:600}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{text-align:center;font-weight:900;font-size:19px;padding:26px 10px}
.tf .opt .em{display:block;font-size:30px;margin-bottom:4px}

.code{background:#0b0e14;border-radius:16px;margin:10px 0 16px;overflow:hidden;border:2px solid #232b3b}
.code .ch{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#161c28;font-size:12px;font-weight:800;color:var(--muted)}
.code .ch i{width:9px;height:9px;border-radius:50%;display:inline-block}
.code pre{margin:0;padding:12px 14px;font-family:var(--mono);font-size:13.5px;line-height:1.55;overflow-x:auto;white-space:pre;color:#d8deea}
.code .c{color:#6b7891}.code .s{color:#ff9bd2;font-weight:700}.code .g{color:#7cc4ff;font-weight:700}.code .j{color:#ffd166}.code .k{color:#9fe3b8}
.code.console pre{white-space:pre-wrap;word-break:break-word}
.code .err{color:#ff7b7f;font-weight:700}.code .info{color:#8fb3d9}.code .cmd{color:#7cf0a8;font-weight:700}
.blank{display:inline-block;min-width:56px;border-bottom:3px dashed var(--amber);color:var(--amber);text-align:center;padding:0 4px;font-weight:800}
.blank.filled{border-bottom-style:solid;animation:pop .3s var(--ease-spring)}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{padding:11px 15px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:0 4px 0 var(--line);font-family:var(--mono);font-size:15px;font-weight:700;transition:transform .1s var(--ease-out),box-shadow .1s,opacity .2s}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.chip.sel{border-color:var(--blue);background:#15263f;box-shadow:0 4px 0 var(--blue-d)}
.chip.used{opacity:.15;pointer-events:none;box-shadow:none}
.chip.txt{font-family:var(--font);font-weight:800}
.order-ans{min-height:70px;border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:9px;margin-bottom:16px;background:#151a24;border:2px dashed #33405a}
.order-ans .chip,.order-bank .chip{text-align:left;width:100%}
.order-ans .chip:not(.txt),.order-bank .chip:not(.txt){white-space:pre-wrap}
.order-bank{display:flex;flex-direction:column;gap:9px}
.order-ans .ph{color:var(--muted);font-size:14px;font-weight:700;padding:14px;text-align:center}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.match .opt{padding:12px;font-size:14px;min-height:60px;display:flex;align-items:center}
.match .opt.l{font-family:var(--mono);font-weight:800;font-size:13.5px}
.match .opt.ok{opacity:.3;border-color:var(--green);background:#123321;pointer-events:none;box-shadow:none;transform:scale(.97)}
.match .opt.bad{border-color:var(--red);background:#3a1618;animation:shake .35s}
.type-in{width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);background:#0b0e14;color:var(--text);font-family:var(--mono);font-size:17px;outline:none;text-transform:uppercase;-webkit-appearance:none}
.type-in:focus{border-color:var(--blue)}

/* Öğren kartı */
.teach{padding-top:4px}
.teach .who{display:flex;align-items:flex-end;gap:10px;margin-bottom:6px}
.teach .who .nz{width:70px;flex-shrink:0}
.teach .tag{background:#15263f;color:#9ccbff;font-weight:900;font-size:12px;padding:5px 10px;border-radius:10px}
.teach h2{font-size:25px;margin:6px 0 12px;font-weight:900;letter-spacing:-.4px;line-height:1.15}
.teach .tbody{font-size:17px;line-height:1.55;font-weight:600;color:#dfe5f0}
.teach .tbody b{color:#fff;font-weight:900}
.teach .tcard{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px}
.fresh .tcard{animation:optIn .35s var(--ease-out)}

/* Geri bildirim */
.fb{padding:14px 18px calc(16px + var(--sb));animation:sheet .3s var(--ease-out);position:relative}
@keyframes sheet{from{transform:translateY(100%)}}
.fb.ok{background:#14301f}.fb.no{background:#3a1618}
.fb .fbh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.fb .fbh .nz{width:52px;flex-shrink:0;margin-top:-30px}
.fb h4{margin:0;font-size:21px;font-weight:900;flex:1}
.fb.ok h4{color:var(--green)}.fb.no h4{color:#ff8a8d}
.fb .xpg{font-weight:900;color:var(--amber);font-size:16px;animation:floatUp 1s var(--ease-out) both}
@keyframes floatUp{from{opacity:0;transform:translateY(10px) scale(.8)}40%{opacity:1;transform:translateY(-4px) scale(1.1)}to{transform:none}}
.fb p{margin:0 0 6px;font-size:15px;line-height:1.45;font-weight:600}
.fb.ok p{color:#c9f2d8}.fb.no p{color:#ffd3d4}
.fb .ans{font-family:var(--mono);font-size:14px;background:rgba(0,0,0,.25);padding:7px 11px;border-radius:10px;display:inline-block;margin-bottom:8px;white-space:pre-wrap;color:#fff}
.fb .btn{margin-top:10px}
.fb.no .btn.primary{background:var(--red);color:#fff;box-shadow:0 4px 0 var(--red-d)}
.fb.ok .btn.primary{background:var(--green)}

/* Toast */
.toast{position:fixed;left:50%;top:calc(var(--st) + 60px);transform:translateX(-50%);background:var(--card2);border:2px solid var(--line);color:var(--text);padding:10px 16px;border-radius:16px;font-weight:900;font-size:15px;z-index:60;display:flex;align-items:center;gap:8px;animation:toast 1.8s var(--ease-out) forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-14px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-8px)}}

/* Sonuç */
.result{text-align:center;padding-top:10px}
.result .nz{width:150px;margin:0 auto 4px}
.result h2{font-size:30px;margin:6px 0 4px;color:var(--amber);font-weight:900;letter-spacing:-.4px}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 12px}
.res-grid div{border-radius:18px;border:3px solid;padding:0 0 10px;overflow:hidden;animation:optIn .4s var(--ease-out) both}
.res-grid div:nth-child(2){animation-delay:.1s}.res-grid div:nth-child(3){animation-delay:.2s}
.res-grid span{display:block;font-size:11px;font-weight:900;text-transform:uppercase;color:#11151d;padding:5px 0;letter-spacing:.4px}
.res-grid b{display:block;font-size:24px;margin-top:8px;font-weight:900}
.res-note{background:var(--card);border-radius:16px;padding:12px;font-weight:800;font-size:14px;margin-top:8px;display:flex;gap:10px;align-items:center;text-align:left;animation:optIn .4s .3s var(--ease-out) both}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* Haberler */
.news-item{background:var(--card);border-radius:18px;padding:12px 14px;margin-bottom:10px;border:2px solid var(--line)}
.news-item.new{border-color:#6b5112;background:#211c10}
.news-item .d{font-size:12px;font-weight:900;color:var(--muted);display:flex;gap:8px;align-items:center}
.news-item .d .nw{background:var(--amber);color:#111;border-radius:7px;padding:1px 7px;font-size:10.5px}
.news-item p{margin:6px 0 4px;font-size:14px;line-height:1.45;color:#d6dce8;word-break:break-word;font-weight:600}
.news-item code,.ref code{font-family:var(--mono);background:#0b0e14;padding:1px 5px;border-radius:6px;font-size:12.5px;color:#7cc4ff}
.lchip{display:inline-flex;gap:5px;margin-top:6px;background:#123321;color:var(--green);font-size:12.5px;font-weight:900;padding:6px 10px;border-radius:10px}
.seg{display:flex;background:var(--card);border-radius:15px;padding:4px;margin-bottom:14px;border:2px solid var(--line)}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-size:13px;font-weight:900;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--card2);color:var(--text)}
.spinner{width:20px;height:20px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* Rehber */
.search{width:100%;padding:13px 15px;border-radius:15px;border:2px solid var(--line);background:var(--card);color:var(--text);font-size:16px;font-family:var(--font);font-weight:700;outline:none;margin-bottom:12px;-webkit-appearance:none}
.search:focus{border-color:var(--blue)}
.ref{padding:13px 14px;border-radius:16px;background:var(--card);margin-bottom:9px;border:2px solid var(--line)}
.ref .n{font-family:var(--mono);font-weight:800;color:#7cc4ff;font-size:15px}
.ref .s{font-family:var(--mono);font-size:12px;color:var(--muted);margin:4px 0;word-break:break-word}
.ref .t{font-size:14px;line-height:1.4;font-weight:600}
.ref .acts{display:flex;gap:14px;margin-top:8px;font-size:13px;font-weight:900}
.ref .acts button{color:var(--green)}
.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;padding:8px 13px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:900;font-size:13px;color:var(--muted)}
.cat.on{background:#15263f;border-color:var(--blue);color:#bfe0ff}

/* Profil */
.prof{display:flex;gap:14px;align-items:center;margin:6px 0 16px}
.prof .nz{width:92px;flex-shrink:0}
.prof h2{margin:0;font-size:24px;font-weight:900}
.lvl{display:flex;align-items:center;gap:8px;margin-top:6px}
.lvl b{background:var(--purple);color:#1f1144;font-size:13px;font-weight:900;padding:3px 9px;border-radius:9px;white-space:nowrap}
.lvl .bar{flex:1}
.lvl .bar i{background:var(--purple)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;gap:10px;align-items:center}
.stat .si{font-size:26px}
.stat b{display:block;font-size:20px;font-weight:900}
.stat span{font-size:12px;color:var(--muted);font-weight:800}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge-it{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.badge-it .bi{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;font-size:27px;background:var(--bc);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.badge-it b{display:block;font-size:12.5px;font-weight:900;line-height:1.2}
.badge-it span{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-top:3px;line-height:1.25}
.badge-it.off .bi{background:#2a3244;filter:grayscale(1);opacity:.5}
.badge-it.off b{color:var(--muted)}
.shop{display:flex;align-items:center;gap:12px}
.shop .si{font-size:34px}
.toggle{width:52px;height:30px;border-radius:15px;background:#2a3244;position:relative;transition:background .2s;flex-shrink:0}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .25s var(--ease-spring)}
.toggle.on{background:var(--green)}.toggle.on::after{transform:translateX(22px)}

/* Tekrar */
.mem-row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px;font-weight:800}
.mem-row span{width:92px;color:var(--muted)}
.mem-row .bar{flex:1;height:12px}
.mem-row b{width:28px;text-align:right}
.weak{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px}
.weak .wl{font-size:12px;font-weight:800;color:var(--muted)}
.weak .wq{font-size:15px;font-weight:700;margin-top:3px}
.lrow{width:100%;text-align:left;display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:9px}
.lrow .li{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,8,14,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg2);border-radius:26px 26px 0 0;padding:22px 18px calc(18px + var(--sb));width:100%;max-width:560px;animation:sheet .3s var(--ease-out);text-align:center}
.modal h3{margin:4px 0 8px;font-size:22px;font-weight:900}
.modal p{font-weight:600;line-height:1.45}
.modal .btn{margin-top:10px}
.modal .nz{width:110px;margin:0 auto}
.reward{font-size:30px;font-weight:900;color:var(--pink);margin:6px 0}
.empty{text-align:center;padding:30px 10px;color:var(--muted);font-weight:700}
.empty .nz{width:120px;margin:0 auto 10px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>

<script src="content1.js"></script>
<script src="content2.js"></script>

<script src="reference.js"></script>
<script src="content1_en.js"></script>
<script src="content2_en.js"></script>
<script src="content3_en.js"></script>
<script src="reference_en.js"></script>
