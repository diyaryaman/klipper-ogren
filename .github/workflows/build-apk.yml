name: Android uygulamasını derle (.apk)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Web dosyalarını uygulamanın içine kopyala
        run: |
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/web
          cp -r web android/app/src/main/assets/web

      - name: Derle
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/release/app-release.apk KlipperOgren.apk

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: KlipperOgren-apk
          path: KlipperOgren.apk
          retention-days: 30

      - name: Herkesin indirebileceği bir bağlantıya koy (Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest KlipperOgren.apk \
            --title "Klipper Öğren (Android)" \
            --notes "En güncel APK. Telefona indirip açın; bilinmeyen kaynaklardan yüklemeye izin verin." \
            --latest
